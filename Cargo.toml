[package]
name = "spacetime"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = ["spacetimedb", "items_core"]

[dependencies]
spacetimedb-sdk = { version = "2.8.*" }

# Window + input
winit = "0.30"
raw-window-handle = "0.6"

# Math
glam = "0.29"

# Error handling & logging
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Asset loading (Assimp-lookalike)
asset-importer = { version = "0.8", features = ["prebuilt"] }

# Binary data for vertices
bytemuck = { version = "1", features = ["derive"] }

# Physics (optional – you can comment this out if you want pure simple physics)
rapier3d = "0.22"

# Vulkan (you will need these later)
ash = { version = "0.38", features = ["linked"] }
ash-window = "0.13"
gltf = "1.4.1"
